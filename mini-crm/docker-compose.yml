version: '3.8'

# Orquestração dos serviços necessários para rodar a aplicação Mini CRM.
# Utilizamos Redis para filas, MySQL para persistência e Reverb para WebSockets.

services:

  # Servidor web Nginx que serve como proxy reverso para o PHP-FPM
  nginx:
    image: nginx:1.25-alpine
    container_name: mini_crm_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - mini_crm_network

  # PHP-FPM que executa a aplicação Laravel
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: mini_crm_php
    volumes:
      - .:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: local
      APP_KEY: base64:PLACEHOLDER_REPLACE_ON_FIRST_RUN
    networks:
      - mini_crm_network

  # Worker da fila Laravel (processa os Jobs assíncronos de score)
  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: mini_crm_queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - mini_crm_network

  # Servidor WebSocket Laravel Reverb para broadcast em tempo real
  reverb:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: mini_crm_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - mini_crm_network

  # Banco de dados principal da aplicação
  mysql:
    image: mysql:8.0
    container_name: mini_crm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mini_crm
      MYSQL_USER: mini_crm
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mini_crm_network

  # MySQL separado para ambiente de testes (não contamina dados de dev)
  mysql_test:
    image: mysql:8.0
    container_name: mini_crm_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mini_crm_test
      MYSQL_USER: mini_crm
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    networks:
      - mini_crm_network

  # Redis usado tanto para filas quanto para cache
  redis:
    image: redis:7.2-alpine
    container_name: mini_crm_redis
    ports:
      - "6379:6379"
    networks:
      - mini_crm_network

volumes:
  mysql_data:

networks:
  mini_crm_network:
    driver: bridge
