; Configurações customizadas do PHP para a aplicação Mini CRM

; Aumenta o tempo máximo de execução para suportar Jobs longos
max_execution_time = 300

; Limites de memória e upload
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M

; Fuso horário padrão da aplicação
date.timezone = America/Sao_Paulo
