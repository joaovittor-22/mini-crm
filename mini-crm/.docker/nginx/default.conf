server {
    listen 80;
    server_name localhost;

    # Aponta para a pasta public do Laravel
    root /var/www/html/public;
    index index.php index.html;

    # Redireciona todas as requisições para o index.php (necessário para rotas Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Passa requisições PHP para o PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Impede acesso a arquivos ocultos (.env, .git etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
